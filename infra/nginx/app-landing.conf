# Mijozlar uchun — mobil ilovani yuklab olish sahifasi (app.yukchibolla.com)
# Joylashtirish: /var/www/ilova-app-landing (infra/app-landing/index.html)
#
# certbot --nginx -d app.yukchibolla.com ishga tushirilgach, bu fayl
# avtomatik 443/SSL bloki bilan yangilanadi.

server {
    listen 80;
    listen [::]:80;
    server_name app.yukchibolla.com;

    root /var/www/ilova-app-landing;
    index index.html;

    location / {
        try_files $uri $uri/ =404;
    }

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;
}
