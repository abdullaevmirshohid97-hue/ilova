# Tenant admin (admin.yukchibolla.com) va Super admin (4020.yukchibolla.com)
# — IKKALASI HAM bitta apps/admin build'idan xizmat qiladi. Qaysi panel
# ko'rsatilishi login'dan KEYIN, foydalanuvchi rolига qarab kod ichida
# hal qilinadi (App.tsx) — shuning uchun alohida build shart emas.
#
# Joylashtirish: /var/www/ilova-admin/dist (pnpm --filter @ilova/admin build natijasi)
#
# certbot --nginx -d admin.yukchibolla.com -d 4020.yukchibolla.com
# ishga tushirilgach, bu fayl avtomatik 443/SSL bloki bilan yangilanadi.

server {
    listen 80;
    listen [::]:80;
    server_name admin.yukchibolla.com 4020.yukchibolla.com;

    root /var/www/ilova-admin/dist;
    index index.html;

    # SPA — barcha noma'lum yo'llar index.html'ga qaytadi (React Router)
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Vite hash'langan fayllar — uzoq muddat keshlanadi
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;
}
