<!doctype html>
<html lang="uz">
<head>
<meta charset="utf-8" />
<!-- Telegram Mini App sahifani qattiq keshlaydi: yangilanish
     ko'rinmay qolmasin uchun keshlash o'chirilgan -->
<meta http-equiv="Cache-Control" content="no-store, must-revalidate" />
<meta http-equiv="Pragma" content="no-cache" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Idaa Farm — katalog</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  /* Telegram temasiga moslashadi: ilova qorong'i bo'lsa — biz ham */
  :root {
    --bg: var(--tg-theme-bg-color, #ffffff);
    --card: var(--tg-theme-secondary-bg-color, #f4f5f7);
    --ink: var(--tg-theme-text-color, #17181c);
    --ink-2: var(--tg-theme-hint-color, #77797f);
    --brand: var(--tg-theme-button-color, #0e7c6b);
    --brand-ink: var(--tg-theme-button-text-color, #ffffff);
    --line: rgba(128, 132, 140, .22);
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body {
    margin: 0; background: var(--bg); color: var(--ink);
    font: 15px/1.45 -apple-system, system-ui, "Segoe UI", Roboto, sans-serif;
    padding-bottom: 84px;
  }
  header {
    position: sticky; top: 0; z-index: 5; background: var(--bg);
    padding: 10px 12px 8px; border-bottom: 1px solid var(--line);
  }
  .qidiruv { display: flex; gap: 8px; }
  input[type=search] {
    flex: 1; min-width: 0; font-size: 16px; padding: 11px 13px;
    border: 1px solid var(--line); border-radius: 11px;
    background: var(--card); color: var(--ink); outline: none;
  }
  input[type=search]:focus { border-color: var(--brand); }
  .tab { display: flex; gap: 6px; margin-top: 8px; }
  .tab button {
    flex: 1; padding: 8px; font-size: 13px; font-weight: 600;
    border: 1px solid var(--line); background: transparent; color: var(--ink-2);
    border-radius: 9px;
  }
  .tab button.faol { background: var(--brand); color: var(--brand-ink); border-color: var(--brand); }

  main { padding: 10px 12px; }
  .karta {
    background: var(--card); border-radius: 12px; padding: 12px;
    margin-bottom: 9px; display: grid; gap: 5px;
  }
  .nom { font-weight: 620; line-height: 1.3; }
  .kichik { font-size: 12.5px; color: var(--ink-2); }
  .qator {
    display: flex; align-items: center; justify-content: space-between;
    gap: 10px; flex-wrap: wrap; row-gap: 8px;
  }
  .narx { font-weight: 750; font-size: 16px; white-space: nowrap; }
  .yoq { color: #c2410c; }
  /* Omborda qolmagan dori ro'yxatdan yo'qolmaydi - mijoz "bor ekan-u,
     tugabdi" deb bilsin. Lekin sotib bo'lmasligi darrov ko'rinsin. */
  .karta.tugagan { opacity: .62; }
  .tugadi {
    font-size: 12px; font-weight: 700; color: #c2410c;
    border: 1px solid currentColor; border-radius: 8px; padding: 6px 12px;
  }

  .qosh {
    border: 0; background: var(--brand); color: var(--brand-ink);
    padding: 9px 15px; border-radius: 9px; font-weight: 650; font-size: 14px;
  }
  .miqdor { display: flex; align-items: center; gap: 6px; flex: none; }
  .miqdor button {
    width: 34px; height: 34px; border-radius: 9px; border: 1px solid var(--line);
    background: transparent; color: var(--ink); font-size: 18px; font-weight: 700;
  }
  /* Raqamning o'zi ham tugma: bosilsa aniq miqdorni yozish mumkin */
  .miqdor .son {
    width: auto; min-width: 46px; padding: 0 8px; font-size: 15px;
    border-color: var(--brand); font-variant-numeric: tabular-nums;
  }
  .miqdor .ochir { color: #c2410c; font-size: 15px; font-weight: 600; }
  .sonKirit {
    width: 64px; height: 34px; text-align: center; font-size: 16px; font-weight: 700;
    border: 1px solid var(--brand); border-radius: 9px; outline: none;
    background: var(--bg); color: var(--ink); font-variant-numeric: tabular-nums;
  }

  /* Xatoni ro'yxat o'rniga ko'rsatib bo'lmaydi: mijoz miqdorni
     o'zgartirayotganda butun katalog yo'qolib ketardi */
  .xabar {
    position: fixed; left: 12px; right: 12px; z-index: 20;
    bottom: calc(96px + env(safe-area-inset-bottom));
    background: var(--ink); color: var(--bg);
    padding: 11px 14px; border-radius: 11px; font-size: 13.5px; text-align: center;
    opacity: 0; transition: opacity .18s ease; pointer-events: none;
  }
  .xabar.bor { opacity: .95; }
  @media (prefers-reduced-motion: reduce) { .xabar { transition: none; } }

  .guruhlar { display: flex; gap: 6px; overflow-x: auto; padding: 8px 12px 0; }
  .guruhlar button {
    white-space: nowrap; padding: 6px 12px; font-size: 12.5px; border-radius: 999px;
    border: 1px solid var(--line); background: transparent; color: var(--ink-2);
  }
  .guruhlar button.faol { background: var(--brand); color: var(--brand-ink); border-color: var(--brand); }
  .koproq { padding: 0 12px 16px; }
  .koproq button {
    width: 100%; padding: 12px; border-radius: 11px; border: 1px solid var(--line);
    background: transparent; color: var(--ink-2); font-size: 14px; font-weight: 600;
  }
  .bosh { text-align: center; color: var(--ink-2); padding: 44px 20px; }
  .yuklanmoqda { text-align: center; color: var(--ink-2); padding: 22px; }

  footer {
    position: fixed; left: 0; right: 0; bottom: 0; background: var(--bg);
    border-top: 1px solid var(--line); padding: 10px 12px calc(10px + env(safe-area-inset-bottom));
    display: none;
  }
  footer.bor { display: block; }
  .jami { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; }
  .asosiy {
    width: 100%; border: 0; background: var(--brand); color: var(--brand-ink);
    padding: 13px; border-radius: 11px; font-weight: 700; font-size: 15px;
  }
  .asosiy:disabled { opacity: .5; }
</style>
</head>
<body>

<header>
  <div class="qidiruv">
    <input id="q" type="search" placeholder="Dori nomi — kirill yoki lotin" autocomplete="off" />
  </div>
  <div class="tab">
    <button id="tabKatalog" class="faol">🔎 Katalog</button>
    <button id="tabSavat">🛒 Savat</button>
  </div>
</header>

<div id="guruhlar" class="guruhlar"></div>

<main id="royxat">
  <div class="yuklanmoqda">Katalog yuklanmoqda...</div>
</main>

<div id="koproq" class="koproq"></div>

<footer id="pastki">
  <div class="jami"><span class="kichik">Savatdagi summa</span><span class="narx" id="jami">0</span></div>
  <button class="asosiy" id="buyurtma">Buyurtma berish</button>
</footer>

<script>
// Eski Android WebView'da `?.` va `??` sintaksis xatosi beradi va butun
// skript ishga tushmaydi. Shuning uchun bu sahifa ES5 uslubida yozilgan.
var tg = (window.Telegram && window.Telegram.WebApp) || null;
if (tg) { tg.ready(); tg.expand(); }

// Sahifa admin saytida turadi, API esa Supabase'da — manzil aniq yozilgan.
// Bu yerda maxfiy kalit YO'Q: kim ekanini Telegram imzosi hal qiladi.
const API = 'https://gnuddryjsmcrjchrbvyz.supabase.co/functions/v1/dori-miniapp';
var initData = (tg && tg.initData) || '';

const royxat = document.getElementById('royxat');
const pastki = document.getElementById('pastki');
const jamiEl = document.getElementById('jami');
const qEl = document.getElementById('q');

let bolim = 'katalog';
let savat = { items: [], total: 0 };

// DIQQAT: toLocaleString/Intl bu yerda ATAYLAB ishlatilmaydi.
// Telegram eski Android WebView'da ICU ma'lumotlari kesilgan bo'ladi va
// locale ko'rsatilgan chaqiruv RangeError tashlaydi. Xato ro'yxatni
// chizish paytida yuz bergani uchun butun katalog ko'rinmay qolardi
// (mobil ilovada xuddi shu xato 6bcc8a5 da tuzatilgan).
function titrat(tur) {
  try { if (tg && tg.HapticFeedback) tg.HapticFeedback.notificationOccurred(tur); } catch (e) {}
}

function pul(n) {
  var x = Math.round(Number(n) || 0);
  var manfiy = x < 0;
  var t = String(Math.abs(x)).replace(/\B(?=(\d{3})+(?!\d))/g, ' ');
  return (manfiy ? '-' : '') + t + " so'm";
}
function ikki(n) { return (n < 10 ? '0' : '') + n; }
function sana(s) {
  if (!s) return null;
  var d = new Date(String(s).replace(' ', 'T'));
  if (isNaN(d.getTime())) return null;
  return ikki(d.getDate()) + '.' + ikki(d.getMonth() + 1) + '.' + d.getFullYear();
}

// Xatolar bizning jurnalga tushadi (client_errors) — Mini App boshqa
// odamning telefonida ochiladi, konsolni ko'rib bo'lmaydi
const ANON = 'sb_publishable_BjX_3t2LGX9y8FsKbCqFdw_7AOnXTN3';
const BAZA = 'https://gnuddryjsmcrjchrbvyz.supabase.co';

function jurnalga(xabar, ekran) {
  try {
    fetch(BAZA + '/rest/v1/rpc/report_client_error', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', apikey: ANON, Authorization: 'Bearer ' + ANON },
      body: JSON.stringify({
        p_app: 'mobile', p_message: String(xabar).slice(0, 400),
        p_screen: 'miniapp:' + (ekran || ''), p_platform: (tg && tg.platform) || 'nomalum',
        p_app_version: 'v2',
      }),
    });
  } catch (e) { /* jurnal ishlamasa ham ilova ishlayversin */ }
}

window.addEventListener('error', (e) => jurnalga(e.message, 'window'));
window.addEventListener('unhandledrejection', (e) => jurnalga(e.reason && e.reason.message || e.reason, 'promise'));

async function api(amal, qoshimcha = {}) {
  try {
    const r = await fetch(API, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ amal, initData, ...qoshimcha }),
    });
    const matn = await r.text();
    let j;
    try { j = JSON.parse(matn); } catch { j = { ok: false, error: 'JAVOB_JSON_EMAS: ' + matn.slice(0, 120) }; }
    if (!j.ok && j.error) jurnalga(amal + ' -> ' + j.error + ' (' + r.status + ')', amal);
    return j;
  } catch (e) {
    jurnalga(amal + ' -> ' + (e && e.message), amal);
    return { ok: false, error: 'Aloqa yoq: ' + (e && e.message) };
  }
}

function yuklanmoqda() {
  royxat.innerHTML = '<div class="yuklanmoqda">Yuklanmoqda...</div>';
}

// ------------------------------------------------------------- katalog
let taymer = null;
let guruh = null;
let offset = 0;
let jamiTopilgan = 0;

qEl.addEventListener('input', () => {
  clearTimeout(taymer);
  const s = qEl.value.trim();
  // Qidiruv bo'shatilsa — katalogga qaytamiz
  if (s.length < 2) {
    if (bolim === 'katalog') katalogniYukla(true);
    return;
  }
  // Har harfda so'rov yubormaymiz — yozib bo'lguncha kutamiz
  taymer = setTimeout(() => qidir(s), 320);
});

// Katalogni sahifalab yuklaydi: 6900 dorini birdan yuborib bo'lmaydi
async function katalogniYukla(boshidan) {
  bolimGa('katalog');
  if (boshidan) {
    offset = 0;
    royxat.innerHTML = '<div class="yuklanmoqda">Yuklanmoqda...</div>';
  }
  const j = await api('katalog', { guruh, offset });
  if (!j.ok) return xato(j.error);

  jamiTopilgan = j.jami || 0;
  // Server aytadi: qoldiq cheklovi o‘chiq bo‘lsa "Qolmadi" yozilmaydi
  cheklovYoq = j.cheklov === false;
  if (boshidan) royxat.innerHTML = '';
  if (!j.items.length && boshidan) {
    royxat.innerHTML = '<div class="bosh">Katalog hali to‘ldirilmagan.</div>';
    return;
  }
  chiz(j.items);
  offset += j.items.length;
  koproqTugmasi();
}

function koproqTugmasi() {
  const q = document.getElementById('koproq');
  if (offset >= jamiTopilgan) { q.innerHTML = ''; return; }
  q.innerHTML = '<button>Yana ko‘rsatish (' + (jamiTopilgan - offset) + ' ta qoldi)</button>';
  q.querySelector('button').onclick = () => katalogniYukla(false);
}

async function guruhlarniYukla() {
  const j = await api('guruhlar');
  const el = document.getElementById('guruhlar');
  const list = (j.guruhlar || []);
  if (!j.ok || list.length === 0) { el.innerHTML = ''; return; }

  el.innerHTML = '';
  const hammasi = document.createElement('button');
  hammasi.textContent = 'Hammasi';
  hammasi.className = guruh ? '' : 'faol';
  hammasi.onclick = () => { guruh = null; guruhlarniYukla(); katalogniYukla(true); };
  el.appendChild(hammasi);

  for (const g of list) {
    const b = document.createElement('button');
    b.textContent = g.grp + ' (' + g.n + ')';
    b.className = guruh === g.grp ? 'faol' : '';
    b.onclick = () => { guruh = g.grp; guruhlarniYukla(); katalogniYukla(true); };
    el.appendChild(b);
  }
}

async function qidir(s) {
  bolimGa('katalog');
  yuklanmoqda();
  document.getElementById('koproq').innerHTML = '';
  const j = await api('qidir', { q: s });
  if (!j.ok) return xato(j.error);

  if (!j.items.length) {
    royxat.innerHTML = '<div class="bosh">Topilmadi. Nomning bir qismini yozib ko‘ring.</div>';
    return;
  }
  royxat.innerHTML = '';
  chiz(j.items);
}

// Dorilar ro'yxatini chizadi (katalog ham, qidiruv ham shundan foydalanadi)
function chiz(items) {
  for (const d of items) {
    const bor = d.stock !== null && d.stock !== undefined && Number(d.stock) > 0;
    const el = document.createElement('div');
    el.className = bor ? 'karta' : 'karta tugagan';
    el.innerHTML =
      '<div class="nom"></div>' +
      '<div class="kichik ishlab"></div>' +
      '<div class="qator"><span class="narx"></span></div>';
    el.querySelector('.nom').textContent = d.name;
    el.querySelector('.ishlab').textContent =
      [d.manufacturer, bor ? 'omborda ' + sonl(d.stock) + ' ta' : null,
       d.eng_yaqin_muddat ? 'muddat ' + sana(d.eng_yaqin_muddat) : null]
        .filter(Boolean).join(' · ');
    el.querySelector('.narx').textContent = pul(d.price);

    kartaAmali(el, d);
    royxat.appendChild(el);
  }
}

// Kartochkaning o'ng tomoni: dori savatda bo'lmasa "+ Savatga", bo'lsa —
// darhol tahrir. Ilgari qo'shilgandan keyin "✓ Savatda" yozuvi qolardi va
// miqdorni o'zgartirish uchun Savat bo'limiga o'tish kerak edi.
function kartaAmali(el, d) {
  const qator = el.querySelector('.qator');
  const eski = qator.querySelector('.amal');
  if (eski) eski.remove();

  // Uch holat: null = noma'lum (prays faylida qoldiq ustuni yo'q),
  // 0 = tugagan, >0 = shuncha bor. Noma'lumni "tugagan" deb qarasak,
  // butun katalog sotuvdan chiqib ketardi.
  const qoldiq = cheklovYoq || d.stock === null || d.stock === undefined ? null : Number(d.stock);

  // Faqat ANIQ tugaganiga tugma qo'yilmaydi
  if (qoldiq !== null && qoldiq <= 0) {
    const yoq = document.createElement('span');
    yoq.className = 'tugadi amal';
    yoq.textContent = 'Qolmadi';
    qator.appendChild(yoq);
    return;
  }

  const q = savatMiqdor[d.id] || 0;

  if (q > 0) {
    const quti = boshqaruv(d.id, q, function (yangi) {
      if (yangi <= 0) kartaAmali(el, d);
    }, qoldiq);
    quti.classList.add('amal');
    qator.appendChild(quti);
    return;
  }

  const tugma = document.createElement('button');
  tugma.type = 'button';
  tugma.className = 'qosh amal';
  tugma.textContent = '+ Savatga';
  tugma.onclick = function () {
    savatMiqdor[d.id] = 1;
    titrat('success');
    jamiOldindan(d.id, 1, d);
    miqdorniYubor(d.id, 1);
    kartaAmali(el, d);
  };
  qator.appendChild(tugma);
}

// ------------------------------------------------------------ miqdor
// Savatdagi miqdorlar: product_id -> qty. Katalog ham, savat ham shu
// yerdan o'qiydi, shuning uchun ikki bo'lim doim bir xil ko'rsatadi.
var savatMiqdor = {};
var cheklovYoq = false;

function miqdorlarniQayta() {
  savatMiqdor = {};
  const items = savat.items || [];
  for (const it of items) savatMiqdor[it.product_id] = Number(it.qty);
}

function sonl(n) {
  const x = Number(n) || 0;
  return Math.round(x) === x ? String(x) : String(Math.round(x * 1000) / 1000);
}

// − [3] +  boshqaruvi. Raqamni bosib aniq miqdorni yozish ham mumkin:
// "24" ni + tugmasi bilan yig'ish uzoq.
// ozgargach(yangi) — chaqiruvchi o'z ekranini yangilashi uchun.
// maxQoldiq - omborda nechta bor. Undan oshirib bo'lmaydi: server ham
// keskilaydi, lekin ekran jim turmasin - tugma "ishlamayotgandek"
// tuyulmasligi uchun sabab aytiladi.
function boshqaruv(doriId, qty, ozgargach, maxQoldiq) {
  const quti = document.createElement('div');
  quti.className = 'miqdor';

  const kam = document.createElement('button');
  kam.type = 'button'; kam.textContent = '−'; kam.setAttribute('aria-label', 'Kamaytirish');
  const son = document.createElement('button');
  son.type = 'button'; son.className = 'son'; son.setAttribute('aria-label', 'Miqdorni kiritish');
  const kop = document.createElement('button');
  kop.type = 'button'; kop.textContent = '+'; kop.setAttribute('aria-label', 'Kopaytirish');

  let joriy = Number(qty) || 0;
  son.textContent = sonl(joriy);

  function qoy(yangi) {
    let v = Number(yangi);
    if (isNaN(v)) return;
    v = Math.round(v * 1000) / 1000;
    if (v < 0) v = 0;
    if (v > 100000) v = 100000;

    // null/undefined = qoldiq noma'lum -> cheklov yo'q
    const chek = (maxQoldiq === null || maxQoldiq === undefined) ? null : Number(maxQoldiq);
    if (chek !== null && chek > 0 && v > chek) {
      v = chek;
      xabar('Omborda faqat ' + sonl(chek) + ' ta bor');
    }

    if (v === joriy) return;
    joriy = v;
    son.textContent = sonl(joriy);

    if (joriy > 0) savatMiqdor[doriId] = joriy;
    else delete savatMiqdor[doriId];

    // Ekran darhol o'zgaradi, server keyin quvib yetadi: tarmoq sekin
    // bo'lsa ham tugma bosilgani sezilib tursin
    jamiOldindan(doriId, joriy);
    miqdorniYubor(doriId, joriy);
    if (ozgargach) ozgargach(joriy);
  }

  kam.onclick = function () { qoy(joriy - 1); };
  kop.onclick = function () { qoy(joriy + 1); };

  // Raqamni bosish -> kiritish maydoni
  son.onclick = function () {
    const inp = document.createElement('input');
    inp.type = 'text';
    inp.setAttribute('inputmode', 'decimal');
    inp.className = 'sonKirit';
    inp.value = sonl(joriy);
    quti.replaceChild(inp, son);
    tahrirda = true;
    inp.focus();
    try { inp.select(); } catch (e) {}

    let tugadi = false;
    function tugat(saqla) {
      if (tugadi) return;
      tugadi = true;
      tahrirda = false;
      if (saqla) {
        const v = parseFloat(String(inp.value).replace(',', '.'));
        if (!isNaN(v)) qoy(v);
      }
      son.textContent = sonl(joriy);
      if (inp.parentNode === quti) quti.replaceChild(son, inp);
    }
    inp.onblur = function () { tugat(true); };
    inp.onkeydown = function (e) {
      if (e.key === 'Enter') { e.preventDefault(); inp.blur(); }
      else if (e.key === 'Escape') { inp.value = sonl(joriy); inp.blur(); }
    };
  };

  const ochir = document.createElement('button');
  ochir.type = 'button';
  ochir.className = 'ochir';
  ochir.textContent = '✕';
  ochir.setAttribute('aria-label', 'Savatdan olib tashlash');
  ochir.onclick = function () { titrat('warning'); qoy(0); };

  quti.appendChild(kam);
  quti.appendChild(son);
  quti.appendChild(kop);
  quti.appendChild(ochir);
  return quti;
}

// Server javobini kutmasdan jami summani hisoblab turamiz.
// dori — katalogdan yangi qo'shilganda narx/nom shu yerdan olinadi.
function jamiOldindan(doriId, qty, dori) {
  const items = savat.items || [];
  let topildi = false;
  for (let i = items.length - 1; i >= 0; i--) {
    if (items[i].product_id === doriId) {
      topildi = true;
      if (qty > 0) { items[i].qty = qty; items[i].sum = Number(items[i].price) * qty; }
      else items.splice(i, 1);
    }
  }
  if (!topildi && qty > 0 && dori) {
    items.push({
      product_id: doriId, name: dori.name, price: Number(dori.price) || 0,
      qty: qty, sum: (Number(dori.price) || 0) * qty,
    });
  }
  savat.items = items;
  savat.total = items.reduce(function (s, it) { return s + (Number(it.sum) || 0); }, 0);
  jaminiChiz();
}

// Server bilan sinxronlash kechiktiriladi: "+" ni ketma-ket bosganda har
// bosishga so'rov ketmasin. Miqdor MUTLAQ yuboriladi (qo'shilmaydi),
// shuning uchun so'rovlar tartibi buzilsa ham natija bir xil bo'ladi -
// oxirgi qiymat qoladi.
var kechikish = {};
function miqdorniYubor(doriId, qty) {
  if (kechikish[doriId]) clearTimeout(kechikish[doriId]);
  kechikish[doriId] = setTimeout(function () {
    delete kechikish[doriId];
    api('ozgartir', { product_id: doriId, qty: qty }).then(function (j) {
      const n = j && j.natija;
      if (!j || !j.ok || !n || !n.ok) {
        const kod = (n && n.error) || (j && j.error) || '';
        xabar(XATO_MATN[kod] || ('Miqdor saqlanmadi: ' + (kod || 'aloqa yo‘q')));
        savatniYangila();
        return;
      }

      // Server qoldiqqacha kesgan bo'lsa - sababini aytamiz
      if (n.cheklandi) xabar('Omborda faqat ' + sonl(n.qoldiq) + ' ta bor');
      savat = n.savat || { items: [], total: 0 };
      miqdorlarniQayta();
      jaminiChiz();
      if (bolim === 'savat' && !tahrirda) savatniChiz();
    });
  }, 350);
}

// --------------------------------------------------------------- savat
function jaminiChiz() {
  jamiEl.textContent = pul(savat.total);
  pastki.classList.toggle('bor', (savat.items || []).length > 0);
}

// Mijoz raqam kiritayotganda ro'yxat qayta chizilmaydi — maydon yopilib
// qolardi
var tahrirda = false;

async function savatniYangila() {
  const j = await api('savat');
  if (!j.ok) return;
  savat = j.savat || { items: [], total: 0 };
  miqdorlarniQayta();
  jaminiChiz();
  if (bolim === 'savat' && !tahrirda) savatniChiz();
}

function savatniChiz() {
  const items = savat.items || [];
  if (!items.length) {
    royxat.innerHTML = '<div class="bosh">Savat bo‘sh.<br><br>Katalogdan dori tanlang.</div>';
    return;
  }
  royxat.innerHTML = '';
  for (const it of items) {
    const el = document.createElement('div');
    el.className = 'karta';
    el.innerHTML =
      '<div class="nom"></div>' +
      '<div class="kichik hisob"></div>' +
      '<div class="qator"><span class="narx summa"></span></div>';
    el.querySelector('.nom').textContent = it.name;

    const hisob = el.querySelector('.hisob');
    const summa = el.querySelector('.summa');
    const chizgich = function (q) {
      hisob.textContent = sonl(q) + ' × ' + pul(it.price);
      summa.textContent = pul(Number(it.price) * q);
    };
    chizgich(Number(it.qty));

    const quti = boshqaruv(it.product_id, Number(it.qty), function (yangi) {
      if (yangi <= 0) {
        el.remove();
        if (!(savat.items || []).length) savatniChiz();
      } else chizgich(yangi);
    }, (it.stock === null || it.stock === undefined) ? null : Number(it.stock));
    quti.classList.add('amal');
    el.querySelector('.qator').appendChild(quti);
    royxat.appendChild(el);
  }
}

// ------------------------------------------------------------- bo'limlar
function bolimGa(nom) {
  bolim = nom;
  document.getElementById('tabKatalog').classList.toggle('faol', nom === 'katalog');
  document.getElementById('tabSavat').classList.toggle('faol', nom === 'savat');
}

document.getElementById('tabKatalog').onclick = () => {
  const s = qEl.value.trim();
  if (s.length >= 2) qidir(s);
  else katalogniYukla(true);
};

document.getElementById('tabSavat').onclick = () => {
  bolimGa('savat');
  document.getElementById('koproq').innerHTML = '';
  savatniChiz();      // saqlangan holat — darhol ko'rinsin
  savatniYangila();   // so'ng serverdagi haqiqiy holat
};

document.getElementById('buyurtma').onclick = async () => {
  const t = document.getElementById('buyurtma');
  t.disabled = true;
  const j = await api('buyurtma');
  t.disabled = false;

  if (j.ok && j.natija && j.natija.ok) {
    titrat('success');
    royxat.innerHTML =
      `<div class="bosh">✅ Buyurtma №${j.natija.order_no} qabul qilindi.<br><br>` +
      `Jami: <b>${pul(j.natija.total)}</b><br><br>Tez orada bog‘lanamiz.</div>`;
    // Buyurtma paytida qoldiq kamayib qolgan bo'lishi mumkin - server
    // nimani kesgani va nimani tashlaganini aytadi
    const ch = (j.natija.cheklangan || []).length;
    const tu = (j.natija.tushdi || []).length;
    if (ch || tu) {
      xabar(
        (tu ? tu + ' ta dori tugab qolgani uchun chiqarildi. ' : '') +
        (ch ? ch + ' ta dori qoldiqqacha kamaytirildi.' : '')
      );
    }

    savat = { items: [], total: 0 };
    savatMiqdor = {};
    pastki.classList.remove('bor');
    setTimeout(function () { if (tg) tg.close(); }, 2500);
  } else {
    const kod = (j.natija && j.natija.error) || j.error || '';
    xabar(XATO_MATN[kod] || ('Buyurtma yuborilmadi: ' + (kod || 'xatolik')));
    savatniYangila();
  }
};

// Ro'yxat o'rniga chiqadi — katalog umuman yuklanmagan holatlar uchun
function xato(matn) {
  royxat.innerHTML = '<div class="bosh">❌ ' + (matn || 'Xatolik') + '</div>';
}

// Server kodlari mijoz tilida
var XATO_MATN = {
  QOLMADI: 'Bu dori omborda qolmadi',
  DORI_TOPILMADI: 'Dori topilmadi',
  MIQDOR_JUDA_KATTA: 'Miqdor juda katta',
  MIQDOR_NOTOGRI: 'Miqdor noto‘g‘ri',
  TELEFON_KERAK: 'Avval botda telefon raqamingizni yuboring — /start',
  TANISHTIRILMAGAN: 'Avval botda telefon raqamingizni yuboring — /start',
  SAVAT_BOSH: 'Savat bo‘sh',
};

// Ro'yxatni saqlab qolib, pastda qisqa xabar
var xabarEl = null, xabarVaqt = null;
function xabar(matn) {
  if (!xabarEl) {
    xabarEl = document.createElement('div');
    xabarEl.className = 'xabar';
    document.body.appendChild(xabarEl);
  }
  xabarEl.textContent = matn;
  xabarEl.classList.add('bor');
  if (xabarVaqt) clearTimeout(xabarVaqt);
  xabarVaqt = setTimeout(function () { xabarEl.classList.remove('bor'); }, 2600);
}

// ------------------------------------------------------------- boshlash
if (!initData) {
  jurnalga('initData bosh - sahifa Telegramdan tashqarida ochilgan', 'boshlash');
  royxat.innerHTML =
    '<div class="bosh">Bu sahifa Telegram ichida ochilishi kerak.<br><br>' +
    'Botga qayting va <b>🛍 Katalog</b> tugmasini bosing.</div>';
} else {
  jurnalga('ochildi: ' + ((tg && tg.platform) || '?') + ' v' + ((tg && tg.version) || '?'), 'boshlash');
  savatniYangila();
  guruhlarniYukla();
  katalogniYukla(true);
}
</script>
